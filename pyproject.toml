[project]
name = "atelierlanggraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nedra", email = "nedramoussa123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-google-genai>=4.5.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-cli[inmem]>=0.4.43",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
atelierlanggraph = "atelierlanggraph:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
